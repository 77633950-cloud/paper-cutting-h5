<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>手机界面预览</title>
  <style>
    body {
      margin: 0;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 40px;
      font-family: sans-serif;
    }
    .phone {
      width: 375px;
      height: 812px;
      background: #000;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      position: relative;
    }
    .phone::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 28px;
      background: #000;
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 10;
    }
    .screen {
      width: 100%;
      height: 100%;
      border-radius: 30px;
      overflow: hidden;
      background: #FFF8F0;
    }
    .screen iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .label {
      position: absolute;
      bottom: -36px;
      left: 0;
      right: 0;
      text-align: center;
      color: #8892b0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <iframe src="http://localhost:5173/"></iframe>
    </div>
    <div class="label">iPhone 375 x 812</div>
  </div>
</body>
</html>
